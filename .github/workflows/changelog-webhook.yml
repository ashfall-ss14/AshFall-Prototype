name: Changelog Discord Webhook

on:
  pull_request_target:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to send changelog for (e.g. 11)'
        required: true
        type: string

jobs:
  send-changelog:
    # Запуск только при успешном слиянии (merge) PR в master, либо при ручном запуске
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Parse changelog and dispatch to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          def main():
              # Цвет полосы карточки Discord Embed (#907036)
              EMBED_COLOR = 0x907036

              webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
              if not webhook_url:
                  print("Секрет DISCORD_CHANGELOG_WEBHOOK не найден или пуст. Пропуск отправки.")
                  return

              event_name = os.environ.get("EVENT_NAME", "")
              if event_name == "workflow_dispatch":
                  pr_num = os.environ.get("INPUT_PR_NUMBER", "").strip()
                  repo = os.environ.get("REPOSITORY", "")
                  token = os.environ.get("GITHUB_TOKEN", "")
                  api_url = f"https://api.github.com/repos/{repo}/pulls/{pr_num}"
                  req = urllib.request.Request(api_url, headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Ashfall-Webhook-Dispatcher"
                  })
                  with urllib.request.urlopen(req) as resp:
                      pr_data = json.loads(resp.read().decode("utf-8"))
                  pr_body = pr_data.get("body", "") or ""
                  pr_url = pr_data.get("html_url", "")
                  pr_title = pr_data.get("title", "")
                  pr_number = str(pr_data.get("number", ""))
                  pr_author = pr_data.get("user", {}).get("login", "")
                  pr_author_avatar = pr_data.get("user", {}).get("avatar_url", "")
              else:
                  pr_body = os.environ.get("PR_BODY", "") or ""
                  pr_url = os.environ.get("PR_URL", "")
                  pr_title = os.environ.get("PR_TITLE", "")
                  pr_number = os.environ.get("PR_NUMBER", "")
                  pr_author = os.environ.get("PR_AUTHOR", "")
                  pr_author_avatar = os.environ.get("PR_AUTHOR_AVATAR", "")

              # Очищаем от HTML-комментариев (включая закомментированный шаблон)
              clean_body = re.sub(r"<!--[\s\S]*?-->", "", pr_body)

              # Ищем блок чейнджлога
              match = re.search(r"(##\s*(?:Чейнджлог|Changelog)[\s\S]*|:cl:[\s\S]*)", clean_body, re.IGNORECASE)
              if not match:
                  print("Секция чейнджлога не найдена. Пропуск.")
                  return

              raw_section = match.group(1).strip()
              m_header = re.match(r"(##\s*(?:Чейнджлог|Changelog)[\s\S]*?)(?=\n##\s+|$)", raw_section, re.IGNORECASE)
              if m_header:
                  raw_section = m_header.group(1).strip()
              else:
                  raw_section = re.split(r"\n##\s+", raw_section)[0].strip()

              if ":cl:" not in raw_section:
                  print("Метка :cl: не найдена. Пропуск.")
                  return

              # Группируем пункты изменений по категориям с нативными списками Discord
              lines = raw_section.splitlines()
              output_blocks = []
              current_author = None
              categories = {"add": [], "tweak": [], "fix": [], "remove": [], "other": []}
              total_entries = 0

              def flush_author():
                  nonlocal current_author, categories
                  if not current_author and not any(categories.values()):
                      return
                  block = []
                  if current_author:
                      block.append(f":cl: **{current_author}**\n")

                  labels = [
                      ("add", "### ✨ Добавлено"),
                      ("tweak", "### ⚙️ Изменено"),
                      ("fix", "### 🛠️ Исправлено"),
                      ("remove", "### 🗑️ Удалено"),
                      ("other", "### 🔹 Прочее")
                  ]
                  for key, title in labels:
                      items = categories[key]
                      if items:
                          block.append(title)
                          for item in items:
                              block.append(f"- {item}")
                          block.append("")

                  output_blocks.append("\n".join(block).strip())
                  categories = {"add": [], "tweak": [], "fix": [], "remove": [], "other": []}
                  current_author = None

              for line in lines:
                  stripped = line.strip()
                  if not stripped or stripped.lower().startswith("##"):
                      continue

                  m_cl = re.match(r"^:cl:\s*(.*)", stripped, re.IGNORECASE)
                  if m_cl:
                      flush_author()
                      current_author = m_cl.group(1).strip()
                      continue

                  m_entry = re.match(r"^[-*]\s*([a-zA-Zа-яА-Я]+)\s*:\s*(.*)", stripped)
                  if m_entry:
                      tag = m_entry.group(1).lower()
                      rest = m_entry.group(2).strip()
                      total_entries += 1
                      if tag in ("add", "добавлено"):
                          categories["add"].append(rest)
                      elif tag in ("tweak", "изменено"):
                          categories["tweak"].append(rest)
                      elif tag in ("fix", "исправлено"):
                          categories["fix"].append(rest)
                      elif tag in ("remove", "удалено"):
                          categories["remove"].append(rest)
                      else:
                          categories["other"].append(f"**{tag}:** {rest}")
                  elif stripped.startswith(("-", "*")):
                      categories["other"].append(stripped.lstrip("-* "))
                      total_entries += 1
                  elif current_author or any(categories.values()):
                      last_cat = next((k for k in reversed(list(categories.keys())) if categories[k]), None)
                      if last_cat:
                          categories[last_cat][-1] += " " + stripped

              flush_author()

              if total_entries == 0:
                  print("В чейнджлоге отсутствуют пункты изменений. Пропуск.")
                  return

              description = "\n\n".join(output_blocks)
              if len(description) > 4000:
                  description = description[:3990] + "\n..."

              title_str = f"PR #{pr_number}: {pr_title}"
              if len(title_str) > 256:
                  title_str = title_str[:253] + "..."

              payload = {
                  "embeds": [
                      {
                          "title": title_str,
                          "url": pr_url,
                          "description": description,
                          "color": EMBED_COLOR,
                          "author": {
                              "name": pr_author[:256] if pr_author else "",
                              "icon_url": pr_author_avatar,
                              "url": f"https://github.com/{pr_author}" if pr_author else ""
                          },
                          "image": {
                              "url": "https://cdn.discohook.app/transparent/400x1.png"
                          }
                      }
                  ]
              }

              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Ashfall-Webhook-Dispatcher"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Оповещение успешно отправлено! Код ответа: {resp.status}")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="ignore")
                  print(f"Ошибка при отправке в Discord (HTTP {e.code}): {err_body}")
                  raise e
              except Exception as e:
                  print(f"Ошибка при отправке в Discord: {e}")
                  raise e

          if __name__ == "__main__":
              main()
          PYEOF
