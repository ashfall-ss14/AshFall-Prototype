- type: entity
  parent: BaseItem
  id: ADTMusicDiskStandard
  name: music disk (standard)
  description: A time-tested collection of symphonies and orchestral works. For those who appreciate elegance.
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/music_disk.rsi
    layers:
    - state: disk_base
      color: "#1cf01c"
    - state: disk_label_music
  - type: Item
    size: Tiny
  - type: Damageable
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/ADT/Items/Handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/ADT/Items/Handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/ADT/Items/Handling/disk_drop.ogg
      params:
        volume: -6
  - type: JukeboxDisk
    tracksCollection: Standard
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: StaticPrice
    price: 50

