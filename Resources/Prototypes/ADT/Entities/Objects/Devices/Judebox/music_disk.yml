- type: entity
  parent: ADTMusicDiskStandard
  id: ADTMusicDiskTest
  name: music disk
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/music_disk.rsi
    layers:
    - state: disk_base
      color: "#0b8a55"
    - state: disk_label_music
  - type: JukeboxDisk
    tracksCollection: Test
  - type: StaticPrice
    price: 50
