- type: constructionGraph
  id: AshfallBarricadeWoodenGraph
  start: start
  graph:
    - node: start
      edges:
        - to: barricade
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 3
    - node: barricade
      entity: AshfallBarricadeWooden
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 5

