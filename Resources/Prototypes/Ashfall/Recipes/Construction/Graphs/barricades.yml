- type: constructionGraph
  id: AshfallBarricadeWoodenGraph
  start: start
  graph:
    - node: start
      edges:
        - to: barricade
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 3
        - to: barricadeDirectional
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 2.5
        - to: barricadeFloor
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 1.5
    - node: barricade
      entity: AshfallBarricadeWooden
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 5
    - node: barricadeDirectional
      entity: AshfallBarricadeWoodenDirectional
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 4
    - node: barricadeFloor
      entity: AshfallBarricadeWoodenFloor
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 3

