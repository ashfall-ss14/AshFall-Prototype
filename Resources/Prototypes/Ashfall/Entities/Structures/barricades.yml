- type: entity
  id: AshfallBaseBarricade
  parent: BaseStructure
  abstract: true
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Ashfall/Structures/barricades.rsi
    drawdepth: BlastDoors
    noRot: false
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
        - BulletImpassable
  - type: Climbable
  - type: Barricade
    minHitChance: 0.0
    maxHitChance: 0.75
    minDistance: 1.5
    maxDistance: 12.0
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ComplexRepairable
    qualityNeeded: Welding
    fuelCost: 5
    material: Steel
    materialRepairTreshold: 40

- type: entity
  id: AshfallBaseBarricadeDirectional
  parent: AshfallBaseBarricade
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.36"
        mask:
        - TableMask
        layer:
        - TableLayer
        - BulletImpassable

- type: entity
  id: AshfallBaseBarricadeFloor
  parent: AshfallBaseBarricade
  abstract: true
  components:
  - type: Sprite
    drawdepth: SmallObjects
  - type: Barricade
    minHitChance: 0.0
    maxHitChance: 0.50
    minDistance: 1.5
    maxDistance: 10.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.2"
        mask:
        - TableMask
        layer:
        - TableLayer
        - BulletImpassable

# Full tile barricades
- type: entity
  id: AshfallBarricadeWooden
  name: ashfall-barricade-wooden
  description: ashfall-barricade-wooden-desc
  parent: AshfallBaseBarricade
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: barricade_wooden
  - type: Tag
    tags:
    - Wooden
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 2
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: 1
  - type: Damageable
    damageModifierSet: Wood
  - type: ComplexRepairable
    material: WoodPlank
    materialRepairTreshold: 25
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

