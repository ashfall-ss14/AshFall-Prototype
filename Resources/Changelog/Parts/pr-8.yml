author: wzzker21
changes:
  - type: Add
    message: Переработана визуальная обратная связь по урону: шейдер агонии перерисован в органичную «гранжную» виньетку крови, реагирующую на острые повреждения.
  - type: Add
    message: Добавлены физиологические шейдеры травм: размытие аккомодации при сотрясениях и шоке, пульсация кровопотери и гипоксии, синхронизированные с реальным состоянием персонажа.
  - type: Add
    message: Добавлен импульс камеры при попаданиях: выстрелы и удары теперь «толкают» взгляд, а интенсивность отдачи зависит от силы урона.
  - type: Add
    message: Добавлена настройка звука тиннитуса (звон в ушах) при повреждении ушей и выстрелах в упор; по умолчанию отключена.
  - type: Add
    message: Добавлен переключатель запасного режима визуальных эффектов урона для слабых машин: на случай проблем с шейдерами.
  - type: Tweak
    message: Визуальный огонь и горение на персонажах синхронизированы с реальными стеками горения: исчезающие языки пламени больше не висят на потушенных игроках.
  - type: Tweak
    message: Оверлеи агонии, кровопотери, гипоксии и сотрясения переведены на общую систему плавных переходов: эффекты наслаиваются и гаснут предсказуемо.
  - type: Tweak
    message: Оптимизированы шейдеры визуального урона: снижена нагрузка на слабые видеокарты.
  - type: Tweak
    message: Полировано меню настроек: чекбоксы срабатывают по всей строке, выровнены выпадающие списки и ползунки, добавлены поясняющие подсказки к новым настройкам.
  - type: Fix
    message: Исправлены фантомные толчки камеры от урона, полученного до подключения к раунду.
  - type: Fix
    message: Исправлена работа переключателей настроек по клику на строку (раньше реагировал только сам чекбокс).
