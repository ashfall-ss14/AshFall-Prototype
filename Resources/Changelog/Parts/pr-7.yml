author: wzzker21
changes:
  - type: Add
    message: Добавлены деревянные, стальные и укреплённые пласталевые баррикады и укрытия (полноразмерные, направленные полустенки и напольные укрепления).
  - type: Add
    message: Добавлена двухэтапная постройка стальной баррикады: возможность достройки односторонней баррикады до полноценного двухстороннего блока дополнительными листами стали.
  - type: Add
    message: Добавлена механика укрытий (Barricade): динамический перехват пуль в зависимости от дистанции стрелка (0% в упор, до 75% на дистанции).
  - type: Add
    message: Добавлена электрическая отмычка: самодельное устройство из батарейки, проводов и металлического прута для подачи питания напрямую на замки в обход системы доступа.
  - type: Add
    message: Электрическая отмычка крафтится в меню постройки и выдерживает три применения, после чего батарейка садится; оставшийся заряд виден при осмотре инструмента.
  - type: Add
    message: Добавлена система многоступенчатого ремонта (ComplexRepairable) для баррикад, шлюзов и ЛКП с армированием листами и сваркой.
  - type: Tweak
    message: Взлом шлюзов выполняется в два шага: сначала отвёрткой открывается панель обслуживания, затем отмычка подаёт питание на замок; лоцеры и баррикады вскрываются напрямую, панель им не нужна.
  - type: Tweak
    message: Вскрытие стало безошибочным: каждая завершённая попытка тратит заряд и гарантированно срабатывает, вместо прежнего рандома на успех.
  - type: Tweak
    message: Без изолированных перчаток замыкание контактов с шансом 30% бьёт током; в изолированных перчатках отмычка безопасна.
  - type: Tweak
    message: Взлом шлюзов ограничен техническими, внешними и сервисными дверями: командные и охранные шлюзы отмычке недоступны.
  - type: Tweak
    message: Направленные баррикады теперь можно свободно возводить поверх стен, окон и шлюзов для укрепления огневых позиций.
  - type: Tweak
    message: Направленным баррикадам настроен точный контур блокировки обзора, а напольные баррикады не закрывают обзор и пропускают свет.
  - type: Tweak
    message: При осмотре повреждённых конструкций со сложным ремонтом теперь выводится подсказка с точным количеством требуемых армирующих материалов перед сваркой.
  - type: Fix
    message: Исправлено исчезновение баррикад после завершения полоски постройки.
  - type: Fix
    message: Исправлено возгорание деревянного пола от камина из-за контактного нагрева.
  - type: Fix
    message: Исправлены вылеты и дёрганье интерфейса меню настроек при сохранении параметров, добавлены недостающие подсказки (тултипы).
